- query_id: mmdocir_0742_P19-1078
  text: Explain the function of the slot gate in the proposed TRADE model.
  paper_id: P19-1078
  category: factual
  relevant_chunk_ids: []
  relevant_pages:
  - 2
  expected_facts:
  - The slot gate in the TRADE model predicts whether a particular (domain, slot)
    pair is triggered by the dialogue. It works alongside the utterance encoder and
    the state generator. The state generator decodes J times independently for all
    possible (domain, slot) pairs, and during the first decoding step, the state generator
    will use the j-th (domain, slot) embeddings to generate its corresponding slot
    values and the slot gate will determine if the pair is relevant based on the dialogue
    context.
  note: MMDocIR | domain=Academic paper | type=text-only
